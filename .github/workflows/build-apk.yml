
name: Build LJN Point APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q LJN_Point_Android_WebView_GitHub_Actions.zip -d extracted
          find extracted -name settings.gradle -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle -print -quit | xargs dirname)
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk-output/LJN-Point.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LJN-Point-APK
          path: apk-output/LJN-Point.apk
